[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gvie-align"
version = "0.1.0"
description = "GVIE align service: warp after photos to baseline view"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "opencv-python-headless>=4.9,<5.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0"]

[tool.setuptools.packages.find]
include = ["align_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

